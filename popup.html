<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web to Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Web to Markdown</h1>

    <div class="section">
      <label for="confluenceUrl">Web Page URL:</label>
      <input type="text" id="confluenceUrl" placeholder="https://example.com/page">
      <button id="getCurrentUrl" class="btn-secondary">현재 탭 URL 가져오기</button>
    </div>

    <div class="section">
      <label for="savePath">저장 폴더 (다운로드 폴더 기준):</label>
      <input type="text" id="savePath" placeholder="예: .claude/web-docs/">
      <small>다운로드 폴더 내 상대 경로. 절대 경로 입력 시 자동 변환됩니다.</small>
    </div>

    <div class="section">
      <label for="fileName">파일명 (선택):</label>
      <input type="text" id="fileName" placeholder="비워두면 페이지 제목 사용">
    </div>

    <div class="section">
      <label>
        <input type="checkbox" id="manualSave">
        저장 위치를 매번 직접 선택 (위 폴더 경로 무시)
      </label>
    </div>

    <button id="convertBtn" class="btn-primary">Markdown으로 변환 및 저장</button>

    <div id="status" class="status"></div>
    <div id="progress" class="progress-container" style="display: none;">
      <div class="progress-bar"></div>
    </div>
    <div id="result" class="result"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
