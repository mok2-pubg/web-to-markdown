<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web to Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Web to Markdown</h1>

    <div class="section mode-toggle">
      <label>
        <input type="radio" name="mode" value="single" checked>
        단일 URL
      </label>
      <label>
        <input type="radio" name="mode" value="batch">
        일괄 처리
      </label>
      <label>
        <input type="radio" name="mode" value="bookmark">
        북마크 폴더
      </label>
      <label>
        <input type="radio" name="mode" value="crawl">
        하위 페이지
      </label>
    </div>

    <div id="singleMode" class="mode-content">
      <div class="section">
        <label for="confluenceUrl">Web Page URL:</label>
        <input type="text" id="confluenceUrl" placeholder="https://example.com/page">
        <button id="getCurrentUrl" class="btn-secondary">현재 탭 URL 가져오기</button>
      </div>

      <div class="section">
        <label for="fileName">파일명 (선택):</label>
        <input type="text" id="fileName" placeholder="비워두면 페이지 제목 사용">
      </div>

      <div class="section">
        <label>
          <input type="checkbox" id="manualSave" checked>
          저장 위치를 직접 선택 (미선택시 download)
        </label>
      </div>
    </div>

    <div id="batchMode" class="mode-content" style="display: none;">
      <div class="section">
        <label for="batchUrls">URL 목록 (한 줄에 하나씩):</label>
        <textarea id="batchUrls" rows="8" placeholder="https://example.com/page1&#10;https://example.com/page2&#10;https://example.com/page3"></textarea>
      </div>
    </div>

    <div id="bookmarkMode" class="mode-content" style="display: none;">
      <div class="section">
        <label for="bookmarkFolder">북마크 폴더 선택:</label>
        <select id="bookmarkFolder">
          <option value="">폴더를 선택하세요</option>
        </select>
        <button id="loadBookmarks" class="btn-secondary">북마크 폴더 불러오기</button>
      </div>
      <div class="section" id="bookmarkInfo" style="display: none;">
        <div class="info-box">
          <strong>선택된 폴더:</strong> <span id="selectedFolderName"></span><br>
          <strong>URL 개수:</strong> <span id="bookmarkCount">0</span>개
        </div>
      </div>
    </div>

    <div id="crawlMode" class="mode-content" style="display: none;">
      <div class="section">
        <label for="crawlStartUrl">시작 페이지 URL:</label>
        <input type="text" id="crawlStartUrl" placeholder="https://example.com/page">
        <button id="getCrawlUrl" class="btn-secondary">현재 탭 URL 가져오기</button>
      </div>

      <div class="section">
        <label for="crawlDepth">크롤링 깊이 (1-5):</label>
        <input type="number" id="crawlDepth" min="1" max="5" value="2" style="width: 100px;">
        <small>깊이 1 = 현재 페이지의 직접 링크만, 깊이 2 = 2단계까지...</small>
      </div>

      <div class="section">
        <label>
          <input type="checkbox" id="sameDomainOnly" checked>
          같은 도메인만 크롤링 (권장)
        </label>
      </div>

      <div class="section" id="crawlPreview" style="display: none;">
        <div class="info-box">
          <strong>발견된 페이지:</strong> <span id="discoveredCount">0</span>개<br>
          <small>변환 버튼을 클릭하면 모든 페이지가 변환됩니다</small>
        </div>
      </div>
    </div>

    <button id="convertBtn" class="btn-primary">Markdown으로 변환 및 저장</button>

    <div id="status" class="status"></div>
    <div id="progress" class="progress-container" style="display: none;">
      <div class="progress-bar"></div>
    </div>
    <div id="result" class="result"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
