<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web to Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Web to Markdown</h1>

    <div class="section">
      <label for="confluenceUrl">Web Page URL:</label>
      <input type="text" id="confluenceUrl" placeholder="https://example.com/page">
      <button id="getCurrentUrl" class="btn-secondary">현재 탭 URL 가져오기</button>
    </div>

    <div class="section">
      <label for="fileName">파일명 (선택):</label>
      <input type="text" id="fileName" placeholder="비워두면 페이지 제목 사용">
    </div>

    <div class="section">
      <p style="margin: 0 0 8px 0; font-size: 13px; color: #172b4d;">
        <strong>💡 저장 위치 안내</strong>
      </p>
      <small style="line-height: 1.5;">
        변환 버튼을 누르면 <strong>저장 대화상자</strong>가 열립니다.<br>
        원하는 위치를 선택하면 Chrome이 해당 경로를 기억합니다.<br>
        (예: C:\Users\username\.claude\web-docs\ 등)
      </small>
    </div>

    <button id="convertBtn" class="btn-primary">Markdown으로 변환 및 저장</button>

    <div id="status" class="status"></div>
    <div id="progress" class="progress-container" style="display: none;">
      <div class="progress-bar"></div>
    </div>
    <div id="result" class="result"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
